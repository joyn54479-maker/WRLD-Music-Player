# Gradle Configuration - Java 17 compatible
# Completely removed PermGen/MaxPermSize (Java 8 deprecated, Java 11+ removed)
# Using modern JVM flags for Java 17
org.gradle.jvmargs=-Xmx2048m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UnlockDiagnosticVMOptions -XX:G1NewCollectionHeuristicsMinOldCumulativeCollectionPercent=15

# Disable daemon to prevent stale JVM args from persisting
org.gradle.daemon=false

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.workers.max=4

# Android Configuration
android.useAndroidX=true
android.enableJetifier=false
android.buildToolsVersion=34.0.0

# Kotlin Configuration
kotlin.code.style=official
kotlin.incremental=true
